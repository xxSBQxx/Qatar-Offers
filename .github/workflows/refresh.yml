name: Refresh offers

on:
  workflow_dispatch:
  schedule:
    # Every six hours (GitHub Actions cron uses UTC).
    - cron: '17 */6 * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: qatar-offers-pages
  cancel-in-progress: false

jobs:
  refresh:
    name: Discover and refresh Qatar offers
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: crawler/requirements.txt

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-ara

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r crawler/requirements.txt

      - name: Install Chromium for JavaScript-rendered pages
        run: python -m playwright install --with-deps chromium

      - name: Run automated crawler regression tests
        working-directory: crawler
        run: python test_run.py

      - name: Discover new official sources
        env:
          GOOGLE_CSE_API_KEY: ${{ secrets.GOOGLE_CSE_API_KEY }}
          GOOGLE_CSE_CX: ${{ secrets.GOOGLE_CSE_CX }}
          BING_SEARCH_KEY: ${{ secrets.BING_SEARCH_KEY }}
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: python crawler/discover.py

      - name: Refresh offers
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_CLASSIFY_MODEL: ${{ vars.ANTHROPIC_CLASSIFY_MODEL }}
          AI_CALL_BUDGET: '40'
          AI_SLEEP: '1.5'
          FETCH_RETRIES: '3'
          GOOGLE_CSE_API_KEY: ${{ secrets.GOOGLE_CSE_API_KEY }}
          GOOGLE_CSE_CX: ${{ secrets.GOOGLE_CSE_CX }}
          BING_SEARCH_KEY: ${{ secrets.BING_SEARCH_KEY }}
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: python crawler/run.py

      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Persist refreshed data and discovery queue
        run: |
          git add web/offers.json web/malls.json data/state.json data/discovered_sources.json data/run.log
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh Qatar offers [skip ci]"
            git push
          else
            echo "No generated data changes to commit."
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - name: Deploy website to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
